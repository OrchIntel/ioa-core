[pytest]
pythonpath =
    .
    src
addopts = --import-mode=importlib
filterwarnings =
    ignore::DeprecationWarning:botocore.*
    ignore::ResourceWarning
markers =
    debt: known debt tests
    nightly: run on RC/nightly
    smoke: tiny 10-record sanity
    quick: 100-record quick check
    step: 1k record step-up
    heavy: 50k/500k heavy runs
    integration: integration coverage
    interactive: interactive/manual coverage
    organization: organization compatibility coverage
    enterprise: enterprise compatibility coverage
    slow: slow-running coverage
    perf: performance coverage
    performance: performance coverage
    durability: durability coverage
    scale: scale coverage
